[project]
name = "pyro-rentals-api"
version = "0.1.0"
description = "PYRO RENTALS production API foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0.46,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.5,<3",
  "PyJWT>=2.9,<3",
  "argon2-cffi>=23.1,<24",
  "email-validator>=2.2,<3",
  "redis>=5,<6",
  "celery>=5.4,<6",
  "httpx>=0.27,<1",
  "boto3>=1.35,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# FastAPI uses Depends/Header call defaults intentionally.
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"]
